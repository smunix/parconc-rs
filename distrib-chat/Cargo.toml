[package]
name = "distrib-chat"
version = "0.1.0"
edition = "2024"
[lib]
name = "distrib_chat"
path = "src/lib.rs"

[[bin]]
name = "distrib-chat"
path = "src/main.rs"

[[bin]]
name = "distrib-chat-client"
path = "src/bin/client.rs"

[dependencies]
elfo = { version = "0.2.0-alpha.21", features = ["full", "network", "unstable"] }
tokio = { version = "1.38", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
anyhow = "1.0"
humantime-serde = "1"
derive_more = { version = "2", features = ["display", "from"] }
futures = "0.3"
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"
hkdf = "0.12"
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }

